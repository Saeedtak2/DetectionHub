name: Credential Dumping Activity By Python Based Tool
id: bf06d97d-255e-4ea5-a6b1-1063e1506125
version: 1
creation_date: '2026-09-08'
modification_date: '2026-09-08'
author: Saeed Takbiri, DetectionHub;
status: experimental
type: TTP
description: Detects LSASS process access for potential credential dumping by a Python-like tool such as LaZagne or Pypykatz. This converted Splunk analytic preserves the original Sigma selection logic and remains experimental until a DetectionHub unit test succeeds in the target environment.
data_source:
- Sysmon EventID 10
search: |-
  index=* TargetImage="*\\lsass.exe" CallTrace="*_ctypes.pyd+*" CallTrace="*:\\Windows\\System32\\KERNELBASE.dll+*" CallTrace="*:\\Windows\\SYSTEM32\\ntdll.dll+*" CallTrace IN ("*python27.dll+*", "*python3*.dll+*") GrantedAccess="0x1FFFFF" | fillnull value="null" dest, user | stats count min(_time) as firstTime max(_time) as lastTime by dest, user | convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)
how_to_implement: 'This analytic was converted from a SigmaHQ stable rule. Ingest the matching log source into Splunk, extract the fields referenced in the search, and constrain index/source/sourcetype to the local CIM or TA field names. Replace the leading index=* with the production index after validation. Tune exclusions only after confirming legitimate activity in the target environment. Expected source classes include: Sysmon EventID 10.'
known_false_positives: Legitimate administrative or operational activity may match Credential Dumping Activity By Python Based Tool. Validate the host, account, parent process, surrounding activity, and any change record before treating the event as malicious.
references:
- https://twitter.com/bh4b3sh/status/1303674603819081728
- https://github.com/skelsec/pypykatz
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_access/proc_access_win_lsass_python_based_tool.yml
drilldown_searches:
- name: View related events for $dest$
  search: '%original_detection_search% | search dest="$dest$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
finding:
  title: Credential Dumping Activity By Python Based Tool involving $dest$
  entity:
    field: dest
    type: system
    score: 70
analytic_story:
- Credential Dumping
asset_type: Windows
mitre_attack_id:
- T1003.001
product:
- Splunk Enterprise
- Splunk Enterprise Security
- Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
- name: Validation Pending
  description: This converted analytic has not yet been tested with a maintained attack-data fixture in DetectionHub. Validate it against authorized simulation data for the original Sigma rule and replace this experimental test with a passing unit test before changing the status to production.
  test_type: experimental
