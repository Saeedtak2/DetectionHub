name: Password Policy Discovery - Linux
id: 23734150-9340-4f26-b7b6-5116ed5d66cb
version: 1
creation_date: '2026-09-08'
modification_date: '2026-09-08'
author: Saeed Takbiri, DetectionHub;
status: experimental
type: TTP
description: Detects password policy discovery commands. This converted Splunk analytic preserves the original Sigma selection logic and remains experimental until a DetectionHub unit test succeeds in the target environment.
data_source:
- Linux Auditd
search: |-
  index=* (type="PATH" name IN ("/etc/login.defs", "/etc/pam.d/auth", "/etc/pam.d/common-account", "/etc/pam.d/common-auth", "/etc/pam.d/common-password", "/etc/pam.d/system-auth", "/etc/security/pwquality.conf")) OR (type="EXECVE" a0="chage" a1 IN ("--list", "-l")) OR (type="EXECVE" a0="passwd" a1 IN ("-S", "--status")) | fillnull value="null" dest, user | stats count min(_time) as firstTime max(_time) as lastTime by dest, user | convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)
how_to_implement: 'This analytic was converted from a SigmaHQ stable rule. Ingest the matching log source into Splunk, extract the fields referenced in the search, and constrain index/source/sourcetype to the local CIM or TA field names. Replace the leading index=* with the production index after validation. Tune exclusions only after confirming legitimate activity in the target environment. Expected source classes include: Linux Auditd.'
known_false_positives: 'Known Sigma guidance: Legitimate administration activities. Validate the host, account, parent process, surrounding activity, and any change record before treating the event as malicious.'
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1201/T1201.md
- https://linux.die.net/man/1/chage
- https://man7.org/linux/man-pages/man1/passwd.1.html
- https://superuser.com/questions/150675/how-to-display-password-policy-information-for-a-user-ubuntu
- https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/lnx_auditd_password_policy_discovery.yml
drilldown_searches:
- name: View related events for $dest$
  search: '%original_detection_search% | search dest="$dest$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
finding:
  title: Password Policy Discovery - Linux involving $dest$
  entity:
    field: dest
    type: system
    score: 30
analytic_story:
- Windows Discovery Techniques
asset_type: Endpoint
mitre_attack_id:
- T1201
product:
- Splunk Enterprise
- Splunk Enterprise Security
- Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
- name: Validation Pending
  description: This converted analytic has not yet been tested with a maintained attack-data fixture in DetectionHub. Validate it against authorized simulation data for the original Sigma rule and replace this experimental test with a passing unit test before changing the status to production.
  test_type: experimental
