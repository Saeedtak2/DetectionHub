name: AWS SecurityHub Findings Evasion
id: 028e3e2e-245f-4ba7-84cd-5c4e07e467c2
version: 1
creation_date: '2026-09-08'
modification_date: '2026-09-08'
author: Saeed Takbiri, DetectionHub;
status: experimental
type: TTP
description: Detects the modification of the findings on SecurityHub. This converted Splunk analytic preserves the original Sigma selection logic and remains experimental until a DetectionHub unit test succeeds in the target environment.
data_source:
- AWS CloudTrail
search: |-
  index=* eventSource="securityhub.amazonaws.com" eventName IN ("BatchUpdateFindings", "DeleteInsight", "UpdateFindings", "UpdateInsight") | fillnull value="null" dest, user | stats count min(_time) as firstTime max(_time) as lastTime by dest, user | convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)
how_to_implement: 'This analytic was converted from a SigmaHQ stable rule. Ingest the matching log source into Splunk, extract the fields referenced in the search, and constrain index/source/sourcetype to the local CIM or TA field names. Replace the leading index=* with the production index after validation. Tune exclusions only after confirming legitimate activity in the target environment. Expected source classes include: AWS CloudTrail.'
known_false_positives: 'Known Sigma guidance: System or Network administrator behaviors; DEV, UAT, SAT environment. You should apply this rule with PROD environment only.. Validate the host, account, parent process, surrounding activity, and any change record before treating the event as malicious.'
references:
- https://docs.aws.amazon.com/cli/latest/reference/securityhub/
- https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/aws/cloudtrail/aws_securityhub_finding_evasion.yml
drilldown_searches:
- name: View related events for $dest$
  search: '%original_detection_search% | search dest="$dest$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
finding:
  title: AWS SecurityHub Findings Evasion involving $dest$
  entity:
    field: dest
    type: system
    score: 70
analytic_story:
- AWS Defense Evasion
asset_type: AWS Instance
mitre_attack_id:
- T1685
product:
- Splunk Enterprise
- Splunk Enterprise Security
- Splunk Cloud
category: cloud
security_domain: access
tests:
- name: Validation Pending
  description: This converted analytic has not yet been tested with a maintained attack-data fixture in DetectionHub. Validate it against authorized simulation data for the original Sigma rule and replace this experimental test with a passing unit test before changing the status to production.
  test_type: experimental
