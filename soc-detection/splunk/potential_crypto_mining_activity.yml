name: Potential Crypto Mining Activity
id: 0a0c2b03-d373-4f68-9f41-998dcc908159
version: 1
creation_date: '2026-09-08'
modification_date: '2026-09-08'
author: Saeed Takbiri, DetectionHub; 
status: experimental
type: TTP
description: Detects command line parameters or strings often used by crypto miners. This converted Splunk analytic preserves the original Sigma selection logic and remains experimental until a DetectionHub unit test succeeds in the target environment.
data_source:
- Sysmon EventID 1
- Windows Event Log Security 4688
- CrowdStrike ProcessRollup2
search: |-
  | tstats summariesonly=false allow_old_summaries=true fillnull_value="null" count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where (Processes.process IN ("* --cpu-priority=*", "*--donate-level=0*", "* -o pool.*", "* --nicehash*", "* --algo=rx/0 *", "*stratum+tcp://*", "*stratum+udp://*", "*LS1kb25hdGUtbGV2ZWw9*", "*0tZG9uYXRlLWxldmVsP*", "*tLWRvbmF0ZS1sZXZlbD*", "*c3RyYXR1bSt0Y3A6Ly*", "*N0cmF0dW0rdGNwOi8v*", "*zdHJhdHVtK3RjcDovL*", "*c3RyYXR1bSt1ZHA6Ly*", "*N0cmF0dW0rdWRwOi8v*", "*zdHJhdHVtK3VkcDovL*") NOT (Processes.process IN ("* pool.c *", "* pool.o *", "*gcc -*"))) by Processes.action Processes.dest Processes.original_file_name Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path Processes.user Processes.user_id Processes.vendor_product | rename Processes.* AS * | convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)
how_to_implement: 'This analytic requires endpoint process-creation telemetry with full command lines. Configure the applicable Splunk Technology Add-on so endpoint events are normalized to the Processes node of the Endpoint Common Information Model data model. Confirm that process, process name, original file name, parent process, destination, user, and process identifiers are populated. Data-model acceleration is recommended but is not required because summariesonly is set to false. Expected source classes include: Sysmon EventID 1, Windows Event Log Security 4688, CrowdStrike ProcessRollup2.'
known_false_positives: 'Known Sigma guidance: Legitimate use of crypto miners; Some build frameworks. Validate the host, account, parent process, surrounding activity, and any change record before treating the event as malicious.'
references:
- https://www.poolwatch.io/coin/monero
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_crypto_mining_monero.yml
drilldown_searches:
- name: View related events for $dest$
  search: '%original_detection_search% | search dest="$dest$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
finding:
  title: Potential Crypto Mining Activity involving $dest$
  entity:
    field: dest
    type: system
    score: 70
analytic_story:
- Cloud Cryptomining
asset_type: Windows
mitre_attack_id:
- T1496
product:
- Splunk Enterprise
- Splunk Enterprise Security
- Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
- name: Validation Pending
  description: This converted analytic has not yet been tested with a maintained attack-data fixture in DetectionHub. Validate it against authorized simulation data for the original Sigma rule and replace this experimental test with a passing unit test before changing the status to production.
  test_type: experimental
