name: Password Dumper Remote Thread in LSASS
id: 59498461-1b9c-4079-8451-0854ad3de934
version: 1
creation_date: '2026-09-08'
modification_date: '2026-09-08'
author: Saeed Takbiri, DetectionHub; Thomas Patzke, original Sigma rule
status: experimental
type: TTP
description: 'Detects password dumper activity by monitoring remote thread creation EventID 8 in combination with the lsass.exe process as TargetImage.

  The process in field Process is the malicious program. A single execution can lead to hundreds of events. This converted Splunk analytic preserves the original Sigma selection logic and remains experimental until a DetectionHub unit test succeeds in the target environment.'
data_source:
- Sysmon EventID 8
search: |-
  index=* TargetImage="*\\lsass.exe" StartModule="" | fillnull value="null" dest, user | stats count min(_time) as firstTime max(_time) as lastTime by dest, user | convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)
how_to_implement: 'This analytic was converted from a SigmaHQ stable rule. Ingest the matching log source into Splunk, extract the fields referenced in the search, and constrain index/source/sourcetype to the local CIM or TA field names. Replace the leading index=* with the production index after validation. Tune exclusions only after confirming legitimate activity in the target environment. Expected source classes include: Sysmon EventID 8.'
known_false_positives: 'Known Sigma guidance: Antivirus products. Validate the host, account, parent process, surrounding activity, and any change record before treating the event as malicious.'
references:
- https://jpcertcc.github.io/ToolAnalysisResultSheet/details/WCE.htm
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/create_remote_thread/create_remote_thread_win_susp_password_dumper_lsass.yml
drilldown_searches:
- name: View related events for $dest$
  search: '%original_detection_search% | search dest="$dest$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
finding:
  title: Password Dumper Remote Thread in LSASS involving $dest$
  entity:
    field: dest
    type: system
    score: 70
analytic_story:
- Credential Dumping
asset_type: Windows
mitre_attack_id:
- T1003.001
product:
- Splunk Enterprise
- Splunk Enterprise Security
- Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
- name: Validation Pending
  description: This converted analytic has not yet been tested with a maintained attack-data fixture in DetectionHub. Validate it against authorized simulation data for the original Sigma rule and replace this experimental test with a passing unit test before changing the status to production.
  test_type: experimental
