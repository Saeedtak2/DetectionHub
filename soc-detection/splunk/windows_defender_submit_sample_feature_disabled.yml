name: Windows Defender Submit Sample Feature Disabled
id: dc7c45b6-e7af-46bd-ac1c-f0f5b97088e3
version: 1
creation_date: '2026-09-08'
modification_date: '2026-09-08'
author: Saeed Takbiri, DetectionHub; Nasreddine Bencherchali (Nextron Systems), original Sigma rule
status: experimental
type: TTP
description: Detects disabling of the "Automatic Sample Submission" feature of Windows Defender. This converted Splunk analytic preserves the original Sigma selection logic and remains experimental until a DetectionHub unit test succeeds in the target environment.
data_source:
- Windows Event Log Microsoft-Windows-Windows Defender
search: |-
  index=* source="WinEventLog:Microsoft-Windows-Windows Defender/Operational" EventCode=5007 NewValue="*\\Real-Time Protection\\SubmitSamplesConsent = 0x0*" | fillnull value="null" dest, user | stats count min(_time) as firstTime max(_time) as lastTime by dest, user | convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)
how_to_implement: 'This analytic was converted from a SigmaHQ stable rule. Ingest the matching log source into Splunk, extract the fields referenced in the search, and constrain index/source/sourcetype to the local CIM or TA field names. Replace the leading index=* with the production index after validation. Tune exclusions only after confirming legitimate activity in the target environment. Expected source classes include: Windows Event Log Microsoft-Windows-Windows Defender.'
known_false_positives: 'Known Sigma guidance: Administrator activity (must be investigated). Validate the host, account, parent process, surrounding activity, and any change record before treating the event as malicious.'
references:
- https://learn.microsoft.com/en-us/defender-endpoint/troubleshoot-microsoft-defender-antivirus?view=o365-worldwide
- https://bidouillesecurity.com/disable-windows-defender-in-powershell/#DisableAntiSpyware
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/windefend/win_defender_config_change_sample_submission_consent.yml
drilldown_searches:
- name: View related events for $dest$
  search: '%original_detection_search% | search dest="$dest$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
finding:
  title: Windows Defender Submit Sample Feature Disabled involving $dest$
  entity:
    field: dest
    type: system
    score: 30
analytic_story:
- Windows Defense Evasion Tactics
asset_type: Windows
mitre_attack_id:
- T1685
product:
- Splunk Enterprise
- Splunk Enterprise Security
- Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
- name: Validation Pending
  description: This converted analytic has not yet been tested with a maintained attack-data fixture in DetectionHub. Validate it against authorized simulation data for the original Sigma rule and replace this experimental test with a passing unit test before changing the status to production.
  test_type: experimental
