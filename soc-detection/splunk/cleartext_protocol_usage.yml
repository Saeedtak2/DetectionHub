name: Cleartext Protocol Usage
id: 5510581e-e9f4-426b-9d6b-eec5493376f8
version: 1
creation_date: '2026-09-08'
modification_date: '2026-09-08'
author: Saeed Takbiri, DetectionHub; Alexandr Yampolskyi, SOC Prime, Tim Shelton, original Sigma rule
status: experimental
type: TTP
description: 'Ensure that all account usernames and authentication credentials are transmitted across networks using encrypted channels.

  Ensure that an encryption is used for all sensitive information in transit. Ensure that an encrypted channels is used for all administrative account access. This converted Splunk analytic preserves the original Sigma selection logic and remains experimental until a DetectionHub unit test succeeds in the target environment.'
data_source:
- Network Firewall
search: |-
  index=* dst_port IN (8080, 21, 80, 23, 50000, 1521, 27017, 3306, 1433, 11211, 15672, 5900, 5901, 5902, 5903, 5904) action IN ("forward", "accept", 2) OR blocked="false" | fillnull value="null" dest, user | stats count min(_time) as firstTime max(_time) as lastTime by dest, user | convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)
how_to_implement: 'This analytic was converted from a SigmaHQ stable rule. Ingest the matching log source into Splunk, extract the fields referenced in the search, and constrain index/source/sourcetype to the local CIM or TA field names. Replace the leading index=* with the production index after validation. Tune exclusions only after confirming legitimate activity in the target environment. Expected source classes include: Network Firewall.'
known_false_positives: Legitimate administrative or operational activity may match Cleartext Protocol Usage. Validate the host, account, parent process, surrounding activity, and any change record before treating the event as malicious.
references:
- https://www.cisecurity.org/controls/cis-controls-list/
- https://www.pcisecuritystandards.org/documents/PCI_DSS_v3-2-1.pdf
- https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.04162018.pdf
- https://github.com/SigmaHQ/sigma/blob/master/rules/network/firewall/net_firewall_cleartext_protocols.yml
drilldown_searches:
- name: View related events for $dest$
  search: '%original_detection_search% | search dest="$dest$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
finding:
  title: Cleartext Protocol Usage involving $dest$
  entity:
    field: dest
    type: system
    score: 30
analytic_story:
- Use of Cleartext Protocols
asset_type: Network
mitre_attack_id: []
product:
- Splunk Enterprise
- Splunk Enterprise Security
- Splunk Cloud
category: network
security_domain: network
tests:
- name: Validation Pending
  description: This converted analytic has not yet been tested with a maintained attack-data fixture in DetectionHub. Validate it against authorized simulation data for the original Sigma rule and replace this experimental test with a passing unit test before changing the status to production.
  test_type: experimental
