name: AWS EC2 Disable EBS Encryption
id: fc21e5f8-b088-4ad2-b30d-17c0146c4025
version: 1
creation_date: '2026-09-08'
modification_date: '2026-09-08'
author: Saeed Takbiri, DetectionHub; Sittikorn S, original Sigma rule
status: experimental
type: TTP
description: 'Identifies disabling of default Amazon Elastic Block Store (EBS) encryption in the current region.\n\n  Disabling default encryption does not change the encryption status of your existing volumes. This converted Splunk analytic preserves the original Sigma selection logic and remains experimental until a DetectionHub unit test succeeds in the target environment.'
data_source:
- AWS CloudTrail
search: |-
  index=* eventSource="ec2.amazonaws.com" eventName="DisableEbsEncryptionByDefault" | fillnull value="null" dest, user | stats count min(_time) as firstTime max(_time) as lastTime by dest, user | convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)
how_to_implement: 'This analytic was converted from a SigmaHQ stable rule. Ingest the matching log source into Splunk, extract the fields referenced in the search, and constrain index/source/sourcetype to the local CIM or TA field names. Replace the leading index=* with the production index after validation. Tune exclusions only after confirming legitimate activity in the target environment. Expected source classes include: AWS CloudTrail.'
known_false_positives: 'Known Sigma guidance: System Administrator Activities; DEV, UAT, SAT environment. You should apply this rule with PROD account only.. Validate the host, account, parent process, surrounding activity, and any change record before treating the event as malicious.'
references:
- https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DisableEbsEncryptionByDefault.html
- https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/aws/cloudtrail/aws_ec2_disable_encryption.yml
drilldown_searches:
- name: View related events for $dest$
  search: '%original_detection_search% | search dest="$dest$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
finding:
  title: AWS EC2 Disable EBS Encryption involving $dest$
  entity:
    field: dest
    type: system
    score: 47
analytic_story:
- AWS Defense Evasion
asset_type: AWS Instance
mitre_attack_id:
- T1486
- T1565
product:
- Splunk Enterprise
- Splunk Enterprise Security
- Splunk Cloud
category: cloud
security_domain: access
tests:
- name: Validation Pending
  description: This converted analytic has not yet been tested with a maintained attack-data fixture in DetectionHub. Validate it against authorized simulation data for the original Sigma rule and replace this experimental test with a passing unit test before changing the status to production.
  test_type: experimental
