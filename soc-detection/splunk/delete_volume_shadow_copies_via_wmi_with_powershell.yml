name: Delete Volume Shadow Copies Via WMI With PowerShell
id: a8ba1ab0-ea4c-4cc7-b729-7fd19fa8d704
version: 1
creation_date: '2026-09-08'
modification_date: '2026-09-08'
author: Saeed Takbiri, DetectionHub;
status: experimental
type: TTP
description: Shadow Copies deletion using operating systems utilities via PowerShell. This converted Splunk analytic preserves the original Sigma selection logic and remains experimental until a DetectionHub unit test succeeds in the target environment.
data_source:
- Powershell 4104
- Windows Event Log Security 4103
search: |-
  index=* Data="*Get-WmiObject*" Data="*Win32_ShadowCopy*" Data IN ("*Delete()*", "*Remove-WmiObject*") | fillnull value="null" dest, user | stats count min(_time) as firstTime max(_time) as lastTime by dest, user | convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)
how_to_implement: 'This analytic was converted from a SigmaHQ stable rule. Ingest the matching log source into Splunk, extract the fields referenced in the search, and constrain index/source/sourcetype to the local CIM or TA field names. Replace the leading index=* with the production index after validation. Tune exclusions only after confirming legitimate activity in the target environment. Expected source classes include: Powershell 4104, Windows Event Log Security 4103.'
known_false_positives: 'Known Sigma guidance: Legitimate Administrator deletes Shadow Copies using operating systems utilities for legitimate reason. Validate the host, account, parent process, surrounding activity, and any change record before treating the event as malicious.'
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1490/T1490.md
- https://www.fortinet.com/blog/threat-research/stomping-shadow-copies-a-second-look-into-deletion-methods
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_classic/posh_pc_delete_volume_shadow_copies.yml
drilldown_searches:
- name: View related events for $dest$
  search: '%original_detection_search% | search dest="$dest$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
finding:
  title: Delete Volume Shadow Copies Via WMI With PowerShell involving $dest$
  entity:
    field: dest
    type: system
    score: 70
analytic_story:
- Ransomware
asset_type: Windows
mitre_attack_id:
- T1490
product:
- Splunk Enterprise
- Splunk Enterprise Security
- Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
- name: Validation Pending
  description: This converted analytic has not yet been tested with a maintained attack-data fixture in DetectionHub. Validate it against authorized simulation data for the original Sigma rule and replace this experimental test with a passing unit test before changing the status to production.
  test_type: experimental
