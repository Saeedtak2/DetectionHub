name: Password Change on Directory Service Restore Mode (DSRM) Account
id: 4a07264f-fa64-4d6d-a96e-6e253a2fa412
version: 1
creation_date: '2026-09-08'
modification_date: '2026-09-08'
author: Saeed Takbiri, DetectionHub; Thomas Patzke, original Sigma rule
status: experimental
type: TTP
description: 'Detects potential attempts made to set the Directory Services Restore Mode administrator password.

  The Directory Service Restore Mode (DSRM) account is a local administrator account on Domain Controllers.

  Attackers may change the password in order to obtain persistence. This converted Splunk analytic preserves the original Sigma selection logic and remains experimental until a DetectionHub unit test succeeds in the target environment.'
data_source:
- Windows Event Log Security
search: |-
  index=* source="WinEventLog:Security" EventCode=4794 | fillnull value="null" dest, user | stats count min(_time) as firstTime max(_time) as lastTime by dest, user | convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)
how_to_implement: 'This analytic was converted from a SigmaHQ stable rule. Ingest the matching log source into Splunk, extract the fields referenced in the search, and constrain index/source/sourcetype to the local CIM or TA field names. Replace the leading index=* with the production index after validation. Tune exclusions only after confirming legitimate activity in the target environment. Expected source classes include: Windows Event Log Security.'
known_false_positives: 'Known Sigma guidance: Initial installation of a domain controller.. Validate the host, account, parent process, surrounding activity, and any change record before treating the event as malicious.'
references:
- https://adsecurity.org/?p=1714
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4794
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_dsrm_password_change.yml
drilldown_searches:
- name: View related events for $dest$
  search: '%original_detection_search% | search dest="$dest$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
finding:
  title: Password Change on Directory Service Restore Mode (DSRM) Account involving $dest$
  entity:
    field: dest
    type: system
    score: 70
analytic_story:
- Credential Dumping
asset_type: Windows
mitre_attack_id:
- T1098
product:
- Splunk Enterprise
- Splunk Enterprise Security
- Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
- name: Validation Pending
  description: This converted analytic has not yet been tested with a maintained attack-data fixture in DetectionHub. Validate it against authorized simulation data for the original Sigma rule and replace this experimental test with a passing unit test before changing the status to production.
  test_type: experimental
