name: Suspicious Unsigned Thor Scanner Execution
id: 1d71ad45-561a-4be2-ae0b-b7db949d889d
version: 1
creation_date: '2026-09-08'
modification_date: '2026-09-08'
author: Saeed Takbiri, DetectionHub; Nasreddine Bencherchali (Nextron Systems), original Sigma rule
status: experimental
type: TTP
description: Detects loading and execution of an unsigned thor scanner binary. This converted Splunk analytic preserves the original Sigma selection logic and remains experimental until a DetectionHub unit test succeeds in the target environment.
data_source:
- Sysmon EventID 7
search: |-
  index=* Image IN ("*\\thor.exe", "*\\thor64.exe") ImageLoaded IN ("*\\thor.exe", "*\\thor64.exe") NOT (Signed="true" SignatureStatus="valid" Signature="Nextron Systems GmbH") | fillnull value="null" dest, user | stats count min(_time) as firstTime max(_time) as lastTime by dest, user | convert timeformat="%Y-%m-%dT%H:%M:%S" ctime(firstTime) ctime(lastTime)
how_to_implement: 'This analytic was converted from a SigmaHQ stable rule. Ingest the matching log source into Splunk, extract the fields referenced in the search, and constrain index/source/sourcetype to the local CIM or TA field names. Replace the leading index=* with the production index after validation. Tune exclusions only after confirming legitimate activity in the target environment. Expected source classes include: Sysmon EventID 7.'
known_false_positives: 'Known Sigma guidance: Other legitimate binaries named "thor.exe" that aren''t published by Nextron Systems. Validate the host, account, parent process, surrounding activity, and any change record before treating the event as malicious.'
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/image_load/image_load_thor_unsigned_execution.yml
drilldown_searches:
- name: View related events for $dest$
  search: '%original_detection_search% | search dest="$dest$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
finding:
  title: Suspicious Unsigned Thor Scanner Execution involving $dest$
  entity:
    field: dest
    type: system
    score: 70
analytic_story:
- Windows Persistence Techniques
asset_type: Windows
mitre_attack_id:
- T1574.001
product:
- Splunk Enterprise
- Splunk Enterprise Security
- Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
- name: Validation Pending
  description: This converted analytic has not yet been tested with a maintained attack-data fixture in DetectionHub. Validate it against authorized simulation data for the original Sigma rule and replace this experimental test with a passing unit test before changing the status to production.
  test_type: experimental
